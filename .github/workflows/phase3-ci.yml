name: Phase 3 CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agrolt_hr?schema=public
      AUTH_SECRET: ci-test-secret-change-me
      ADMIN_SEED_PASSWORD: ci-test-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run build
