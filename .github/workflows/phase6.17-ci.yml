name: HR Platform CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "phase-6.17/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agrolt_hr?schema=public
      AUTH_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma@7 validate
      - run: npx prisma@7 generate
      - run: npx tsc --noEmit
      - run: npm run build
