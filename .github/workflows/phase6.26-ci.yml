name: Phase 6.26 CI
on:
  push:
    branches: [phase-6.26/ai-hr-workload-balancer]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx tsc --noEmit